<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI CRM for real estate: automate leads, WhatsApp, email & sales pipeline." />
    <title>CORTEXA AI CRM</title>
    <!-- Lucide Icons (self-hosted, pinned to v1.22.0 — no third-party CDN) -->
    <script src="/vendor/lucide.min.js"></script>
    <!-- Google Ads global site tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17836518151"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-17836518151');
    </script>
    <style>
      /* First-paint splash: shown before the JS bundle mounts React, and reused
         by the app's auth-loading state so the handoff is seamless. */
      .app-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#f7f8fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;z-index:1}
      .app-splash-word{font-size:22px;font-weight:700;letter-spacing:.22em;color:#4f46e5}
      .app-spinner{width:34px;height:34px;border-radius:50%;border:3px solid #e5e7eb;border-top-color:#4f46e5;animation:app-spin .8s linear infinite}
      @keyframes app-spin{to{transform:rotate(360deg)}}
      body.crm-dark .app-splash{background:#0f172a}
      body.crm-dark .app-splash-word{color:#a5b4fc}
      body.crm-dark .app-spinner{border-color:#1e293b;border-top-color:#a5b4fc}
      @media (prefers-reduced-motion:reduce){.app-spinner{animation:none}}
    </style>
  </head>
  <body>
    <script>
      (function(){ var k='crm-theme'; if(localStorage.getItem(k)==='dark') document.body.classList.add('crm-dark'); })();
    </script>
    <div id="root">
      <div class="app-splash">
        <div class="app-splash-word">CORTEXA</div>
        <div class="app-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
