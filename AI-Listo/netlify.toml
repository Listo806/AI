[build]
  command = "npm run build"
  publish = "dist"

# ─────────────────────────────────────────────────────────────
# listostays.com → always serves vacation rentals
# Root of listostays.com redirects to /vacation-rentals/search
# ─────────────────────────────────────────────────────────────

[[redirects]]
  from = "https://listostays.com/"
  to = "https://listostays.com/vacation-rentals/search"
  status = 302
  force = true

[[redirects]]
  from = "https://www.listostays.com/"
  to = "https://listostays.com/vacation-rentals/search"
  status = 302
  force = true

# ─────────────────────────────────────────────────────────────
# SPA fallback — all other routes serve index.html (must be last)
# ─────────────────────────────────────────────────────────────

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
