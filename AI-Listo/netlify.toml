[build]
  command = "npm run build"
  publish = "dist"

# Canonicalize the Netlify subdomain to the primary domain
[[redirects]]
  from = "https://stirring-liger-864437.netlify.app/*"
  to = "https://www.cortexaaicrm.com/:splat"
  status = 301
  force = true

# SPA fallback (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
